name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # GoatTown's cell has no npm runtime, so a generated app may have no
      # lockfile or one that predates a package.json edit. The action resolves
      # the manifest into a lockfile in CI, then uses npm ci for the build,
      # license gate, release evidence, and SBOM. @criblio is public on npmjs,
      # so this needs no package credential.
      #
      # The ref below is still a SHA — that pins the ACTION, which is
      # supply-chain hygiene every other step here follows (and which
      # `npm run security:static` enforces), not a framework source
      # dependency.
      - uses: criblio/cribl-search-app-framework/.github/actions/release-build@965a5fc5b64aac5da2ddca16105280209fdb1093
      - name: Retain exact tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14
