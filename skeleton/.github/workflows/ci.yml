name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # @criblio packages live in GitHub Packages, which requires auth even for
  # public reads. This is what replaced cloning the framework at a pinned
  # SHA — see .npmrc.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Registry mode: no `framework-sha`, so the action skips the
      # pinned-clone step and `npm ci` resolves @criblio from the registry
      # against this app's own lockfile. The framework version you build
      # against is pinned by package-lock.json like any other dependency,
      # rather than by a SHA kept in step by hand.
      #
      # The ref below is still a SHA — that pins the ACTION, which is
      # supply-chain hygiene every other step here follows (and which
      # `npm run security:static` enforces), not a framework source
      # dependency.
      - uses: criblio/cribl-search-app-framework/.github/actions/release-build@5c7659bbcbdd0a4ef366f4767bfee70cf5523251
        with:
          registry-token: ${{ github.token }}
      - name: Retain exact tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: build/*
          if-no-files-found: error
          retention-days: 14
