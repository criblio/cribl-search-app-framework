name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # The skeleton job installs the published @criblio packages, and GitHub
  # Packages requires auth even for public reads.
  packages: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Build first: app-utils and cell-workspace both consume
      # agent-protocol's emitted d.ts, so the root script fixes the order
      # rather than trusting alphabetical workspace order.
      - run: npm run build
      - run: npm test --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run audit --workspaces --if-present
      # Guards the one rule a green build cannot see: a package published to
      # the wrong registry installs fine here and 404s inside an app GoatTown
      # generates, because esm.sh mirrors npmjs only.
      - run: npm run check:publish-config

  # Prove a scaffolded app still builds. The skeleton is a template, not a
  # workspace, so nothing above touches it — and it silently rotted through
  # the @cribl → @criblio rename: `npm run build` on a fresh clone failed
  # with TS2307 on both src/api re-exports plus three undeclared
  # `window.CRIBL_*` globals, and the root-vs-subpath import trap only
  # shows up in the bundler, never in tsc. All of that is invisible until
  # someone actually scaffolds an app, which is the worst time to find it.
  #
  # Built in a temp copy with APPNAME substituted, exactly as step 2 of
  # "Creating a new app" in CLAUDE.md instructs.
  skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Deliberately NO credential of any kind. The scaffold has to install
      # the way a stranger's checkout does — plain public npmjs, no .npmrc,
      # no token — because that is the only way this job can catch a
      # skeleton range npmjs cannot satisfy. With `${{ github.token }}` in
      # the env it resolved `@criblio/app-utils@^0.7.0` against GitHub
      # Packages, which holds 0.5.0–0.8.0 and so answered with 0.7.0; npmjs
      # has only 0.8.0, and `^0.7.0` on a 0.x version excludes it. Green
      # here, 404 for every app GoatTown generated.
      - name: Scaffold an app from the skeleton and build it
        run: |
          set -euo pipefail
          cp -R skeleton "$RUNNER_TEMP/scaffolded"
          cd "$RUNNER_TEMP/scaffolded"
          # Mirror release-build's dependency sequence. First prove a new app
          # can create its missing lock, then make that lock stale with the
          # same kind of package.json edit GoatTown can make in its npm-less
          # cell and prove the second resolution refreshes it.
          sed -i 's/APPNAME/scaffold-ci/g' package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm pkg set 'dependencies.picocolors=^1.1.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(node -p 'require("./package-lock.json").packages[""].dependencies.picocolors')" = '^1.1.1'
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
          # Then ask the PUBLIC registry to satisfy each runtime @criblio
          # range on its own. `npm install` above can pass on a range npmjs
          # cannot satisfy — a lockfile-less install reuses whatever a warm
          # cache or a mirror offers — and a GoatTown-generated app has no
          # install step at all: `build_app` rewrites each bare import to
          # `https://esm.sh/<name>@<range>`, and esm.sh resolves that range
          # against npmjs alone. Runtime deps only; a devDependency never
          # reaches a bundle.
          for name in $(node -p 'Object.keys(require("./package.json").dependencies||{}).filter(n=>n.startsWith("@criblio/")).join("\n")'); do
            range=$(node -p "require('./package.json').dependencies['$name']")
            # No pipe here on purpose: `if v=$(npm view … | tail -1)` tests
            # tail's status, not npm's, so the guard passes on the very
            # failure it exists to catch unless `pipefail` happens to be
            # set. Verified in both directions before committing.
            if v=$(npm view "$name@$range" version --registry https://registry.npmjs.org 2>/dev/null); then
              echo "✓ $name@$range → $v"
            else
              echo "::error::$name@$range has no match on npmjs, so every app built from this skeleton 404s at bundle time. Note a caret on a 0.x version excludes the next minor — ^0.7.0 means >=0.7.0 <0.8.0."
              exit 1
            fi
          done
