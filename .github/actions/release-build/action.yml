name: Build and verify Cribl App release artifact
description: Run the canonical verification and packaging pipeline. Two framework modes — registry (default; the app depends on published @criblio packages and needs only npm auth) or pinned-clone (legacy; pass framework-sha matching the app's .framework-sha file).
inputs:
  framework-sha:
    description: Legacy pinned-clone mode — full cribl-search-app-framework commit SHA to clone. Omit for registry mode.
    required: false
    default: ''
  registry-token:
    description: Token with packages:read for npm.pkg.github.com (registry mode; pass github.token). Public packages accept any GITHUB_TOKEN.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - name: Clone shared framework at recorded commit (pinned-clone mode)
      if: inputs.framework-sha != ''
      shell: bash
      run: |
        set -euo pipefail
        SHA='${{ inputs.framework-sha }}'
        test "$(tr -d '[:space:]' < .framework-sha)" = "$SHA" || {
          echo "::error::action input does not match .framework-sha"
          exit 1
        }
        git clone --filter=blob:none https://github.com/criblio/cribl-search-app-framework.git ../cribl-search-app-framework
        git -C ../cribl-search-app-framework checkout --detach "$SHA"
        test "$(git -C ../cribl-search-app-framework rev-parse HEAD)" = "$SHA"
        npm --prefix ../cribl-search-app-framework/packages/app-utils ci
        npm --prefix ../cribl-search-app-framework/packages/app-tooling ci
    - name: Install locked dependencies
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
      run: |
        set -euo pipefail
        # Registry mode: the app's committed .npmrc routes the @criblio
        # scope; append the (env-substituted) auth line here so npm can
        # actually authenticate. Appended to the checkout only — never
        # committed.
        if [ -n "$NODE_AUTH_TOKEN" ]; then
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> .npmrc
        fi
        npm ci
    - name: Verify source
      shell: bash
      run: npm run verify
    - name: Supply-chain gates
      shell: bash
      run: npm run security:static && npm run audit
    - name: Build candidate exactly once
      shell: bash
      run: npm run package
    - name: Inspect candidate and create release evidence
      shell: bash
      run: npm run release:evidence
